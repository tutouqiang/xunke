<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}巡课系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <span class="brand">📋 巡课系统</span>
  <nav>
    <a href="{{ url_for('home') }}">巡课</a>
    <a href="{{ url_for('records') }}">巡课记录</a>
    <a href="{{ url_for('rooms') }}">教室一览</a>
  </nav>
</header>

<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="foot">
  <span>巡课系统 · {{ now }}</span>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
